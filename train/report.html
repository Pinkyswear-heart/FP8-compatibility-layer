body { margin: 0; }

.sub { color: var(--text-secondary); margin: 0 0 20px; max-width: 900px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 16px; color: var(--text-secondary); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .lbl { fill: var(--text-secondary); font-size: 11px; }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 12px; display: none;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); z-index: 10; min-width: 200px; }
.tip .row { display: flex; align-items: center; gap: 8px; }
.tip .row b { font-variant-numeric: tabular-nums; min-width: 56px; }
.tip .row i { width: 12px; height: 2px; display: inline-block; }
.tip .row span { color: var(--text-secondary); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-secondary); font-weight: 500; font-size: 12px; }
td .key { display: inline-block; width: 12px; height: 2px; margin-right: 8px; vertical-align: middle; }
.notes { color: var(--text-secondary); font-size: 13px; max-width: 900px; }
.notes li { margin-bottom: 4px; }
</style>

  const tr = h("tr", null, tb);
  const c0 = h("td", null, tr); const k = h("span", null, c0, "key"); k.style.background = `var(${r.slot})`; c0.appendChild(document.createTextNode(r.name));
  const c = r.config;
  h("td", c ? `${c.fwd.toUpperCase()} / ${c.bwd.toUpperCase()}` : "FP32", tr);
  h("td", c ? ({ tensor: "per-tensor FP32", block: `block32 ${c.ue8m0 ? "UE8M0" : "FP32"}`, none: "无（scale=1）" })[c.granularity] : "—", tr);
  h("td", last(r.val_loss).toFixed(4), tr);
  const dl = last(r.val_loss) - last(base.val_loss);
  h("td", r === base ? "—" : (dl >= 0 ? "+" : "") + dl.toFixed(4), tr);
  h("td", fmtPct(last(r.val_tok_acc)), tr);
  h("td", fmtPct(last(r.val_seq_acc)), tr);
  h("td", r === base ? "—" : fmtPct(r.flush.reduce((a, b) => a + b, 0) / r.flush.length), tr);
  h("td", r === base ? "—" : r.drift.toFixed(3), tr);
  h("td", (r.sec_per_step * 1e3).toFixed(1), tr);
});

// notes
const notes = document.getElementById("notes");
h("h2", "读法", notes);
const ul = h("ul", null, notes);
[
  "权重偏移 = ‖W_recipe − W_FP32‖ / ‖W_FP32‖（训练结束时），同一初始化与数据顺序下衡量 FP8 噪声让轨迹偏离多少。",
  "梯度下溢：反向 dY 量化后变为 0 的非零元素占比。无缩放时 E5M2 最小次正规数 1.5e-5，梯度大多比它小，被直接清零。",
  "反向全 E4M3 的动态范围（2^-9 ~ 448）比 E5M2（2^-16 ~ 57344）窄；配合 per-tensor 缩放时，下溢比例比 E5M2 高，但小模型上仍能收敛。",
  "这是数值模拟：没有节省显存或时间，速度列只反映模拟开销。",
].forEach(t => h("li", t, ul));
