<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="390" rx="10" fill="#ffffff"/>
  <style>
    .t  { fill:#0f172a; font-size:14px }
    .lb { fill:#475569; font-size:12px }
    .sm { fill:#64748b; font-size:11px }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace }
    .hd { fill:#0f172a; font-size:15px; font-weight:600 }
  </style>

  <text x="28" y="34" class="hd">FP8 的两种位布局，以及它们到 FP16 的解码</text>

  <!-- E4M3FN row -->
  <text x="28" y="76" class="t mono">E4M3FN</text>
  <text x="28" y="94" class="sm">max 448，无 inf</text>

  <g>
    <rect x="130" y="58" width="36" height="34" rx="4" fill="#fde68a" stroke="#d97706"/>
    <text x="148" y="80" class="t mono" text-anchor="middle">S</text>
    <rect x="166" y="58" width="144" height="34" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="238" y="80" class="t mono" text-anchor="middle">E E E E</text>
    <rect x="310" y="58" width="108" height="34" rx="4" fill="#bbf7d0" stroke="#059669"/>
    <text x="364" y="80" class="t mono" text-anchor="middle">M M M</text>
    <text x="130" y="108" class="sm">1 位符号</text>
    <text x="196" y="108" class="sm">4 位指数（bias 7）</text>
    <text x="326" y="108" class="sm">3 位尾数</text>
  </g>

  <!-- E5M2 row -->
  <text x="28" y="160" class="t mono">E5M2</text>
  <text x="28" y="178" class="sm">max 57344，有 inf</text>

  <g>
    <rect x="130" y="142" width="36" height="34" rx="4" fill="#fde68a" stroke="#d97706"/>
    <text x="148" y="164" class="t mono" text-anchor="middle">S</text>
    <rect x="166" y="142" width="180" height="34" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="256" y="164" class="t mono" text-anchor="middle">E E E E E</text>
    <rect x="346" y="142" width="72" height="34" rx="4" fill="#bbf7d0" stroke="#059669"/>
    <text x="382" y="164" class="t mono" text-anchor="middle">M M</text>
    <text x="130" y="192" class="sm">1 位符号</text>
    <text x="206" y="192" class="sm">5 位指数（bias 15）</text>
    <text x="350" y="192" class="sm">2 位尾数</text>
  </g>

  <line x1="28" y1="222" x2="732" y2="222" stroke="#e2e8f0"/>

  <!-- decode -->
  <text x="28" y="252" class="hd">解码到 FP16：只是移位，不查表</text>

  <text x="28" y="286" class="lb mono">E5M2 → FP16</text>
  <rect x="150" y="270" width="280" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="164" y="287" class="t mono">h = b &lt;&lt; 8</text>
  <text x="446" y="287" class="sm">指数 bias 同为 15，整字节平移即可</text>

  <text x="28" y="328" class="lb mono">E4M3FN → FP16</text>
  <rect x="150" y="312" width="280" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="164" y="329" class="t mono">((b&amp;0x87)&lt;&lt;8)|((b&amp;0x78)&lt;&lt;7)|(8&lt;&lt;10)</text>
  <text x="446" y="329" class="sm">bias 差 8，补到指数上</text>
  <text x="446" y="346" class="sm">次正规数（8 种）走小表兜底</text>

  <text x="28" y="368" class="sm">每 4 个码装进一个 32 位字，用 2 次 __vadd2 + 2 次 __byte_perm 一起解码。</text>
  <text x="28" y="384" class="sm">实测比 256 项共享内存查表快约 1.6×（随机访问会触发 bank conflict）。</text>
</svg>
