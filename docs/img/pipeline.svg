<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="470" rx="10" fill="#ffffff"/>
  <style>
    .t  { fill:#0f172a; font-size:13px }
    .hd { fill:#0f172a; font-size:15px; font-weight:600 }
    .lb { fill:#475569; font-size:12px }
    .sm { fill:#64748b; font-size:11px }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="28" y="34" class="hd">常规做法 vs 本项目：权重在哪里被还原</text>

  <!-- baseline -->
  <rect x="28" y="56" width="804" height="104" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="44" y="78" class="lb">常规反量化：先在显存里还原出完整 FP16 权重，再做 GEMM</text>

  <rect x="44" y="92" width="120" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="104" y="112" class="t mono" text-anchor="middle">FP8 权重</text>
  <text x="104" y="130" class="sm" text-anchor="middle">显存 N×K 字节</text>

  <line x1="172" y1="116" x2="212" y2="116" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="220" y="92" width="150" height="48" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="295" y="112" class="t" text-anchor="middle">反量化 kernel</text>
  <text x="295" y="130" class="sm" text-anchor="middle">写回显存</text>

  <line x1="378" y1="116" x2="418" y2="116" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="426" y="92" width="160" height="48" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="506" y="112" class="t mono" text-anchor="middle">完整 FP16 权重</text>
  <text x="506" y="130" class="sm" text-anchor="middle">再占 2×N×K 字节</text>

  <line x1="594" y1="116" x2="634" y2="116" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="642" y="92" width="110" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="697" y="121" class="t" text-anchor="middle">cuBLAS GEMM</text>

  <text x="768" y="121" class="sm">显存没省</text>

  <!-- ours -->
  <rect x="28" y="180" width="804" height="150" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="44" y="202" class="lb">本项目：解码发生在 kernel 内部的 tile 里，解码结果只存在于共享内存和寄存器</text>

  <rect x="44" y="218" width="120" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="104" y="238" class="t mono" text-anchor="middle">FP8 权重</text>
  <text x="104" y="256" class="sm" text-anchor="middle">显存 N×K 字节</text>

  <line x1="172" y1="242" x2="212" y2="242" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="220" y="208" width="532" height="100" rx="6" fill="#ffffff" stroke="#22c55e" stroke-dasharray="5 3"/>
  <text x="236" y="228" class="sm">一个 kernel 内</text>

  <rect x="238" y="238" width="118" height="54" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="297" y="259" class="t" text-anchor="middle">取 128 位</text>
  <text x="297" y="277" class="sm" text-anchor="middle">= 16 个码</text>

  <line x1="364" y1="265" x2="396" y2="265" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="404" y="238" width="140" height="54" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="474" y="259" class="t" text-anchor="middle">位运算解码</text>
  <text x="474" y="277" class="sm" text-anchor="middle">→ 共享内存 FP16</text>

  <line x1="552" y1="265" x2="584" y2="265" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="592" y="238" width="146" height="54" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="665" y="259" class="t" text-anchor="middle">WMMA Tensor Core</text>
  <text x="665" y="277" class="sm" text-anchor="middle">FP32 累加</text>

  <text x="768" y="248" class="sm">显存只放</text>
  <text x="768" y="264" class="sm">FP8 一份</text>

  <!-- formula -->
  <rect x="28" y="350" width="804" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="374" class="lb">kernel 实际计算的式子：</text>
  <text x="44" y="402" class="t mono">y[m,n] = xs[m] · Σ_g ws[n,g] · Σ_{k∈g} x16[m,k] · dec(wq[n,k]) + bias[n]</text>
  <text x="44" y="428" class="sm">xs 是激活的行缩放（精确的 2 的幂），ws 是权重的分组缩放，dec 是上面那两行位运算。两个缩放都在 epilogue 里一次性应用，不进内层循环。</text>
</svg>
